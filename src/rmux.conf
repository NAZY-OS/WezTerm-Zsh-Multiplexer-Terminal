# ============================================================
# RMUX / tmux Configuration
# ============================================================

# Shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

# Anzeigezeiten
set -g display-panes-time 1500
set -g display-message-time 5000

# Prefix
unbind C-b
set -g prefix C-e
bind C-e send-prefix

# Allgemeines
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Statusleiste
set -g status-left '#{?client_prefix,#[fg=#1d2021]#[bg=#d65d0e] PREFIX #[bg=#458588] #S #[default],#[fg=#ebdbb2]#[bg=#3c3836] #S #[default]}'
set -g status-left-length 30
set -g status-right '#[fg=#fabd2f]%H:%M#[default] | #[fg=#8ec07c]%d-%b-%Y#[default]'
set -g status-right-length 30
set -g status-interval 5
set -g status-position bottom
set -g status-style 'fg=#ebdbb2,bg=#282828'

setw -g window-status-format ' #[fg=#a89984]#I:#W '
setw -g window-status-current-format '#[fg=#282828,bg=#b16286,bold] #I:#W #[default]'

# Pane-Ränder
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#b16286'

# Pane-Aufteilung und Navigation
bind h split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'

bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# Pane-Größe anpassen
bind H resize-pane -L 7
bind J resize-pane -D 7
bind K resize-pane -U 7
bind L resize-pane -R 7

# Pane-Zoom
bind z resize-pane -Z

# Fensterverwaltung
bind o new-window -c '#{pane_current_path}'
bind j previous-window
bind k next-window
bind l last-window

# Scrollen und Copy-Modus
bind e copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Mausrad im Copy-Modus
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Dienstprogramme
bind t run-shell 'wezterm start'
bind r source-file ~/.config/rmux/rmux.conf \; display-message 'RMUX config reloaded'
