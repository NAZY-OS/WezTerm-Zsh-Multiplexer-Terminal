# ============================================================
# RMUX configuration
# Prefix is configured separately as Alt+E.
# ============================================================


# -------------------- Shell --------------------

# Use Nushell for new panes.
#set -g default-shell /usr/bin/nu

# Fish alternatives — uncomment ONE line if you want Fish instead.
# Linux:
# set -g default-shell /usr/bin/fish
# macOS with Homebrew:
# set -g default-shell /opt/homebrew/bin/fish

# zsh altnative
set -g default-shell /usr/bin/zsh

unbind C-b
set -g prefix C-e
bind C-e send-prefix


# -------------------- General behavior --------------------

# Enable mouse support.
set -g mouse on

# Keep a large scrollback history.
set -g history-limit 50000

# Start window and pane numbering at 1.
set -g base-index 1
set -g pane-base-index 1

# Close numbering gaps when windows are removed.
set -g renumber-windows on

# Use vi-style keys in copy mode.
setw -g mode-keys vi


# -------------------- Status bar --------------------

# Show a colored prefix indicator when the prefix key has been pressed.
set -g status-left '#{?client_prefix,#[fg=black]#[bg=colour208] PREFIX ACTIVE #[default],#[fg=white]#[bg=colour24] #S #[default]}'
set -g status-left-length 30

# Show the clock and date on the right.
set -g status-right " %H:%M | %d-%b-%Y "
set -g status-right-length 30
set -g status-interval 5

# Simple status-bar colors.
set -g status-position bottom
set -g status-style "fg=colour252,bg=colour235"

# Make the active window stand out.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour0,bg=colour39,bold] #I:#W #[default]"

# Pane border colors.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"


bind h split-window -h
bind v split-window -v


# -------------------- Pane navigation --------------------

# Prefix, then w/a/s/d to move between panes.
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# Prefix, then H/J/K/L to resize the active pane.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Prefix, then z to zoom or unzoom the active pane.
bind z resize-pane -Z


# -------------------- Windows --------------------

# Prefix, then o: create a new window in the current directory.
bind o new-window -c "#{pane_current_path}"

# Prefix, then j/k: previous/next window.
bind j previous-window
bind k next-window

# Prefix, then l: return to the last active window.
bind l last-window


# -------------------- Copy mode --------------------

# Prefix, then e: enter copy mode.
bind e copy-mode

# In vi copy mode, press v to start selecting text.
bind -T copy-mode-vi v send-keys -X begin-selection

# In vi copy mode, press y to copy the selection and leave copy mode.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# -------------------- Utilities --------------------

# Prefix, then t: open a separate WezTerm window.
# Requires "wezterm" to be available in PATH.
bind t run-shell "wezterm start"

# Prefix, then r: reload this config.
bind r source-file ~/.config/rmux/rmux.conf \; display-message "RMUX config reloaded"


# -------------------- Hotkey help --------------------

# Prefix, then i: show this custom shortcut summary.
bind i display-message -d 15000 "HOTKEYS\nv = split side-by-side\nx = split top/bottom\nH/J/K/L = resize panes\nz = zoom pane\no = new window\nj/k = previous/next window\nl = last window\ne = copy mode\nt = WezTerm\nr = reload\ni = this guide\n? = built-in key list"
