# ============================================================
# RMUX Configuration (Optimized with Error Handling)
# ============================================================

# -------------------- Shell & Startup Behavior --------------------
set -g default-shell /usr/bin/zsh
set -g default-command "/usr/bin/zsh"

# Error-Exit-Code Handling (longer display + 2x Bell)
set -g display-panes-time 1500  # 1.5 seconds for pane displays
set -g display-message-time 5000  # 5 seconds for error messages

# -------------------- Prefix & Key Bindings --------------------
unbind C-b
set -g prefix C-e
bind C-e send-prefix

# -------------------- General Behavior --------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# -------------------- Status Bar (Gruvbox Colors) --------------------
# Status bar with harmonious Gruvbox colors
set -g status-left '#{?client_prefix,#[fg=#1d2021]#[bg=#d65d0e] PREFIX #[bg=#458588] #S #[default],#[fg=#ebdbb2]#[bg=#3c3836] #S #[default]}'
set -g status-left-length 30
set -g status-right " #[fg=#fabd2f]%H:%M#[default] | #[fg=#8ec07c]%d-%b-%Y#[default] "
set -g status-right-length 30
set -g status-interval 5
set -g status-position bottom
set -g status-style "fg=#ebdbb2,bg=#282828"

# Active window highlighting
setw -g window-status-format " #[fg=#a89984]#I:#W "
setw -g window-status-current-format "#[fg=#282828,bg=#b16286,bold] #I:#W #[default]"

# Pane border colors (Gruvbox harmony)
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b16286"

# -------------------- Error Handling --------------------
# Function for error exit with sound and longer display
run_with_error_handling() {
  if ! "$@"; then
    tmux display-message -d 5000 "⚠ Error: Command failed with exit code $?"  # 5 second display
    printf "\a\a" > /dev/console  # 2x Bell
    return 1
  fi
  return 0
}

# -------------------- Pane Navigation --------------------
bind h run_with_error_handling "split-window -h"
bind v run_with_error_handling "split-window -v"

# -------------------- Pane Control --------------------
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# Resize with HJKL (larger steps)
bind H resize-pane -L 7
bind J resize-pane -D 7
bind K resize-pane -U 7
bind L resize-pane -R 7

# Zoom function
bind z resize-pane -Z

# -------------------- Window Management --------------------
bind o run_with_error_handling "new-window -c \"#{pane_current_path}\""
bind j previous-window
bind k next-window
bind l last-window

# -------------------- Copy Mode --------------------
bind e copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -------------------- Utilities --------------------
bind t run-shell "wezterm start"
bind r source-file ~/.config/rmux/rmux.conf \; display-message "RMUX config reloaded (#[fg=#8ec07c]✓#[default])"
